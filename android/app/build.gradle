apply plugin: 'com.android.application'

/**
 * Version source of truth.
 *
 * Local builds use the defaults below. CI overrides them per release:
 *   ORG_GRADLE_PROJECT_skillsyncVersionName=1.2.0  -> versionName (string)
 *   ORG_GRADLE_PROJECT_skillsyncVersionCode=7      -> versionCode (integer)
 *
 * versionName is a semantic version string; versionCode is an integer that
 * must strictly increase for every update you install/publish. If a semantic
 * version (e.g. "2.0.0") is supplied for versionCode, its major number (2)
 * is used as versionCode so the build never mistakes "2.0.0" for a code.
 */
def skillsyncVersionName = (project.findProperty('skillsyncVersionName') ?: '1.0.0').toString()
def skillsyncVersionCode = project.findProperty('skillsyncVersionCode')?.toString()?.trim()
if (skillsyncVersionCode == null || skillsyncVersionCode.isEmpty()) {
    skillsyncVersionCode = 1
} else if (skillsyncVersionCode ==~ /\d+/) {
    // Plain integer: use it directly.
    skillsyncVersionCode = skillsyncVersionCode.toInteger()
} else if (skillsyncVersionCode ==~ /\d+(\.\d+)*/) {
    // Semantic version (e.g. "2.0.0"): use the major version as versionCode.
    def majorVersion = skillsyncVersionCode.tokenize('.')[0].toInteger()
    println "SkillSync: skillsyncVersionCode '${skillsyncVersionCode}' is a version name; using major version '${majorVersion}' as versionCode."
    skillsyncVersionCode = majorVersion
} else {
    throw new GradleException(
        "skillsyncVersionCode must be a non-negative integer or a semantic version like '2.0.0', " +
        "but was '${skillsyncVersionCode}'. Set ORG_GRADLE_PROJECT_skillsyncVersionCode " +
        "(or -PskillsyncVersionCode) accordingly."
    )
}

/**
 * Release signing.
 *
 * Secrets never live in the repository. Values are read from (in order):
 *   1. android/keystore.properties  (git-ignored, for local release builds)
 *   2. environment variables        (GitHub Actions secrets)
 * When nothing is configured, the release variant simply builds unsigned
 * instead of failing, so debug workflows keep working.
 */
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def signingValue = { String propKey, String envKey ->
    def value = keystoreProps.getProperty(propKey) ?: System.getenv(envKey)
    return (value == null || value.trim().isEmpty()) ? null : value.trim()
}

def storeFilePath = signingValue('storeFile', 'ANDROID_KEYSTORE_PATH')
def storePasswordValue = signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
def keyAliasValue = signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
def keyPasswordValue = signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')

def releaseSigningReady = storeFilePath != null &&
        storePasswordValue != null &&
        keyAliasValue != null &&
        keyPasswordValue != null &&
        file(storeFilePath).exists()

android {
    namespace = "com.skillsync.os"
    // compileSdk comes from the project's existing config (android/variables.gradle).
    // API 36 is the level supported by the pinned AGP 8.13 / Capacitor 8 setup; the
    // fallback keeps configuration from ever failing with "project ':app' does not
    // specify compileSdk" if variables.gradle is unavailable.
    compileSdk = rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        applicationId "com.skillsync.os"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode skillsyncVersionCode
        versionName skillsyncVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            } else {
                println "SkillSync: no release keystore configured — building an UNSIGNED release APK."
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
