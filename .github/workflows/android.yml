name: Android APK

# Builds the SkillSync Android app.
#  - Run manually from the Actions tab (workflow_dispatch), or
#  - push a tag like v1.0.0 to also publish a GitHub Release with the APK.
#
# Optional repository secrets for a signed release build:
#   ANDROID_KEYSTORE_BASE64    base64 of your skillsync-release.jks
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias (e.g. skillsync)
#   ANDROID_KEY_PASSWORD       key password
# Without them (or if they are wrong) the workflow still succeeds and produces
# the debug APK plus an unsigned release APK, with a warning explaining why.

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version name (e.g. 1.0.0). Defaults to the tag or 1.0.0."
        required: false
      versionCode:
        description: "Version code (integer, must increase every release)."
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Pinned Android command-line tools, used only when the runner has none.
  CMDLINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Uses the Android SDK preinstalled on GitHub's Ubuntu runners when it is
      # there; otherwise downloads the official command-line tools into a
      # private SDK folder. Then installs exactly what this project needs
      # (compileSdk/targetSdk 36).
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ] || [ ! -w "$SDK" ]; then
            echo "No usable preinstalled Android SDK — downloading command-line tools."
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" "$CMDLINE_TOOLS_URL"
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Android SDK: $SDK"
          echo "sdkmanager:  $SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          # `yes` is killed by SIGPIPE when sdkmanager exits; that is expected.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" > "$RUNNER_TEMP/sdk-install.log" \
            || { tail -n 50 "$RUNNER_TEMP/sdk-install.log"; echo "::error::Android SDK package install failed (see log above)."; exit 1; }
          test -d "$SDK/platforms/android-36" || { echo "::error::platforms;android-36 missing after install."; exit 1; }
          test -d "$SDK/build-tools/36.0.0" || { echo "::error::build-tools;36.0.0 missing after install."; exit 1; }
          printf 'sdk.dir=%s\n' "$SDK" > android/local.properties
          echo "Android SDK ready."

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_NAME: ${{ github.event.inputs.versionName }}
          INPUT_CODE: ${{ github.event.inputs.versionCode }}
        run: |
          NAME="${INPUT_NAME:-}"
          if [ -z "$NAME" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) NAME="${GITHUB_REF_NAME#v}" ;;
              *) NAME="1.0.0" ;;
            esac
          fi
          CODE="${INPUT_CODE:-}"
          if [ -z "$CODE" ]; then CODE="${GITHUB_RUN_NUMBER}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building SkillSync $NAME (code $CODE)"

      - name: Build offline web bundle
        run: bun run build:mobile

      - name: Sync Capacitor Android project
        run: bunx cap sync android

      # Decodes the keystore and checks that the password and alias really
      # open it. Any problem becomes a clear warning and an unsigned release
      # build instead of an obscure Gradle failure.
      - name: Decode and verify release keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "path=" >> "$GITHUB_OUTPUT"
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — the release APK will be unsigned."
            exit 0
          fi
          missing=""
          [ -z "${KEYSTORE_PASSWORD:-}" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "${KEY_ALIAS:-}" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "${KEY_PASSWORD:-}" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::warning::Missing secrets:$missing — the release APK will be unsigned."
            exit 0
          fi
          KS="$RUNNER_TEMP/skillsync-release.jks"
          # Strip whitespace/newlines that sneak in when pasting the secret.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$KS" 2>/dev/null || [ ! -s "$KS" ]; then
            rm -f "$KS"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not valid base64 — the release APK will be unsigned."
            exit 0
          fi
          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            rm -f "$KS"
            echo "::warning::The keystore could not be opened with ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS (wrong password or alias?) — the release APK will be unsigned."
            exit 0
          fi
          echo "path=$KS" >> "$GITHUB_OUTPUT"
          echo "Release keystore decoded and verified."

      - name: Build APKs
        working-directory: android
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_skillsyncVersionName: ${{ steps.version.outputs.name }}
          ORG_GRADLE_PROJECT_skillsyncVersionCode: ${{ steps.version.outputs.code }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Rename artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/SkillSync-${{ steps.version.outputs.name }}-debug.apk"
          REL=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$REL" "artifacts/SkillSync-${{ steps.version.outputs.name }}-release.apk"
          ls -lh artifacts

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/skillsync-release.jks"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: skillsync-apk-${{ steps.version.outputs.name }}
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/SkillSync-${{ steps.version.outputs.name }}-release.apk
          generate_release_notes: true
