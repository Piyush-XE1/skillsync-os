name: Android APK

# Builds the SkillSync Android app.
#  - Run manually from the Actions tab (workflow_dispatch), or
#  - push a tag like v1.0.0 to also publish a GitHub Release with the APK.
#
# Required repository secrets for a signed release build:
#   ANDROID_KEYSTORE_BASE64    base64 of your skillsync-release.jks
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias (e.g. skillsync)
#   ANDROID_KEY_PASSWORD       key password
# Without them the workflow still succeeds and produces the debug APK plus an
# unsigned release APK.

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version name (e.g. 1.0.0). Defaults to the tag or 1.0.0."
        required: false
      versionCode:
        description: "Version code (integer, must increase every release)."
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${{ github.event.inputs.versionName }}"
          if [ -z "$NAME" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) NAME="${TAG#v}" ;;
              *) NAME="1.0.0" ;;
            esac
          fi
          CODE="${{ github.event.inputs.versionCode }}"
          if [ -z "$CODE" ]; then CODE="${GITHUB_RUN_NUMBER}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building SkillSync $NAME (code $CODE)"

      - name: Build offline web bundle
        run: bun run build:mobile

      - name: Sync Capacitor Android project
        run: bunx cap sync android

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/skillsync-release.jks"
            echo "path=$RUNNER_TEMP/skillsync-release.jks" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — the release APK will be unsigned."
          fi

      - name: Build APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_skillsyncVersionName: ${{ steps.version.outputs.name }}
          ORG_GRADLE_PROJECT_skillsyncVersionCode: ${{ steps.version.outputs.code }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename artifacts
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/SkillSync-${{ steps.version.outputs.name }}-debug.apk"
          REL=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$REL" "artifacts/SkillSync-${{ steps.version.outputs.name }}-release.apk"
          ls -lh artifacts

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/skillsync-release.jks"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: skillsync-apk-${{ steps.version.outputs.name }}
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/SkillSync-${{ steps.version.outputs.name }}-release.apk
          generate_release_notes: true
